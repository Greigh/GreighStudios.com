# greighstudios.com — Nginx reverse proxy (HTTP bootstrap).
#
# Install:
#   scp -> /etc/nginx/sites-available/greighstudios.com
#   ln -s ../sites-available/greighstudios.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Then let Certbot add the TLS server block + HTTP->HTTPS redirect:
#   certbot --nginx -d greighstudios.com -d www.greighstudios.com
# Certbot edits this file on the server; deploy.sh never overwrites it.

upstream greigh_studios {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name greighstudios.com www.greighstudios.com;

    # Canonicalize www -> apex.
    if ($host = www.greighstudios.com) {
        return 301 http://greighstudios.com$request_uri;
    }

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Long-cache immutable Next.js build assets.
    location /_next/static/ {
        proxy_pass http://greigh_studios;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://greigh_studios;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

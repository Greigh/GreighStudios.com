# git.greighstudios.com — Nginx reverse proxy for Forgejo.
#
# Install:
#   scp deploy/forgejo/nginx.git.greighstudios.com.conf root@<VPS_IP>:/etc/nginx/sites-available/git.greighstudios.com
#   ln -sf /etc/nginx/sites-available/git.greighstudios.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS Certificate via Certbot:
#   certbot --nginx -d git.greighstudios.com --non-interactive --agree-tos -m hello@greighstudios.com
#
# Upstream Forgejo process listening locally on 127.0.0.1:3030

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream forgejo {
    server 127.0.0.1:3030;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name git.greighstudios.com;

    # Required by Forgejo for URL-encoded slashes in branch names and commit paths
    merge_slashes off;

    # Allow large git push payloads, releases, and LFS objects
    client_max_body_size 512m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;
    gzip_min_length 1024;

    # Map missing theme-auto.css to theme-forgejo-auto.css with caching
    location = /assets/css/theme-auto.css {
        rewrite ^ /assets/css/theme-forgejo-auto.css break;
        proxy_pass http://forgejo;
        proxy_cache forgejo_assets;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Static assets (JS, CSS, SVGs, fonts, images) - cached for 1 year immutable
    location /assets/ {
        proxy_pass http://forgejo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Nginx disk cache
        proxy_cache forgejo_assets;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;

        # Strip Forgejo's default 'private' cache-control and cookies
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;

        # Clean public immutable cache header for browser and edge CDNs
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Avatars (user & repo avatars) - cached for 7 days
    location ~* ^/avatars?/ {
        proxy_pass http://forgejo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache forgejo_assets;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;

        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Direct favicon.ico serving via internal asset proxy
    location = /favicon.ico {
        rewrite ^ /assets/img/favicon.ico break;
        proxy_pass http://forgejo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache forgejo_assets;
        proxy_cache_valid 200 1d;

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;

        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Common site meta assets - cached for 1 day
    location ~* ^/(favicon\.(svg|png|ico)|manifest\.json|robots\.txt)$ {
        proxy_pass http://forgejo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache forgejo_assets;
        proxy_cache_valid 200 1d;

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;

        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Dynamic application requests
    location / {
        proxy_pass http://forgejo;
        proxy_http_version 1.1;

        # WebSockets support (conditional)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large git operations
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
